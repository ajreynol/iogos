name: anoieu

on: [push, pull_request]

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: the policy checker, at the commit this repository pins
        env:
          # A commit, never a branch: a run that can turn green without anybody
          # committing is not evidence that a commit was good. Bumping it is a
          # commit here, and only to a revision where anoieu's own CI is green.
          # See docs/maintenance.md.
          ANOIEU_REV: 6f9ee38b3c142dce22458a5ba290c062b7899aa9
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none --no-checkout \
            https://github.com/ajreynol/anoieu.git "$RUNNER_TEMP/anoieu"
          git -C "$RUNNER_TEMP/anoieu" checkout --quiet "$ANOIEU_REV"
          python3 "$RUNNER_TEMP/anoieu/scripts/policy_check.py" --version
          python3 "$RUNNER_TEMP/anoieu/scripts/policy_check.py" \
            --root "$GITHUB_WORKSPACE"
